# Раздача собранного SPA. Заменила `vite preview` 21.09.2026.
#
# ПОЧЕМУ: `vite preview` — инструмент для локальной проверки сборки, а не
# прод-сервер, и это прямо написано в документации Vite. Здесь он крутился от
# root внутри контейнера, смотрел наружу через nginx хоста и тащил за собой
# весь сборочный тулчейн: vite, typescript и @vitejs/plugin-react лежат в
# `dependencies`, поэтому даже `npm install --omit=dev` ставил их в рантайм —
# отсюда образ на 383 MB. Теперь в рантайме только статика и nginx.
#
# Заголовки безопасности здесь НЕ дублируются: их ставит nginx хоста в
# sites-available/weighly (HSTS, X-Content-Type-Options, X-Frame-Options,
# Referrer-Policy), и они применяются в том числе к проксированным ответам.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Версия nginx в заголовке Server никому здесь не нужна.
    server_tokens off;

    # Ассеты собираются с хэшем в имени (index-BLqYd611.js), поэтому кэшируются
    # навсегда. =404 вместо фолбэка намеренно: промах по хэшированному имени —
    # это рассинхрон деплоя, и отдавать вместо него index.html значит прятать
    # поломку за «белым экраном» вместо честной ошибки в консоли.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # index.html не кэшируем — иначе после деплоя браузер продолжит просить
    # старые хэши ассетов, которых уже нет.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # SPA-фолбэк. ОБЯЗАТЕЛЕН: маршрутизация в приложении рукописная
    # (history.pushState/popstate в src/main.tsx), маршруты /accept-invite,
    # /forgot-password, /password-reset, /reset-password. Без фолбэка прямой
    # заход по такой ссылке — а именно так приходят письма про сброс пароля —
    # даёт 404.
    location / {
        try_files $uri /index.html;
    }
}
