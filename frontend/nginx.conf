# Раздача собранного SPA. Заменила `vite preview` 21.09.2026.
#
# ПОЧЕМУ: `vite preview` — инструмент для локальной проверки сборки, а не
# прод-сервер, и это прямо написано в документации Vite. Здесь он крутился от
# root внутри контейнера, смотрел наружу через nginx хоста и тащил за собой
# весь сборочный тулчейн: vite, typescript и @vitejs/plugin-react лежат в
# `dependencies`, поэтому даже `npm install --omit=dev` ставил их в рантайм —
# отсюда образ на 383 MB. Теперь в рантайме только статика и nginx.
#
# Заголовки безопасности поделены между двумя nginx. Общие для SPA и API
# (HSTS, X-Content-Type-Options, X-Frame-Options, Referrer-Policy) ставит nginx
# хоста в sites-available/weighly, и они применяются в том числе к
# проксированным ответам — здесь они НЕ дублируются. Content-Security-Policy и
# Permissions-Policy ставятся здесь (location = /index.html ниже): CSP описывает
# то, что грузит именно эта сборка, и должна меняться вместе с ней. На хосте
# их не добавлять — две CSP браузер применяет обе сразу.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Версия nginx в заголовке Server никому здесь не нужна.
    server_tokens off;

    # Ассеты собираются с хэшем в имени (index-BLqYd611.js), поэтому кэшируются
    # навсегда. =404 вместо фолбэка намеренно: промах по хэшированному имени —
    # это рассинхрон деплоя, и отдавать вместо него index.html значит прятать
    # поломку за «белым экраном» вместо честной ошибки в консоли.
    #
    # Один заголовок Cache-Control, а не `expires 1y` плюс add_header: директива
    # expires выпускает СВОЙ Cache-Control, и вместе они дают два заголовка в
    # ответе. RFC 9111 велит склеивать их в список, браузеры так и делают, но
    # промежуточные кэши ведут себя по-разному, а намерение читается неясно.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html не кэшируем — иначе после деплоя браузер продолжит просить
    # старые хэши ассетов, которых уже нет.
    #
    # CSP и Permissions-Policy — тоже здесь: любой HTML-ответ приходит в этот
    # location (`/` — через index, маршруты SPA — фолбэком try_files из
    # location /), а ассетам они не нужны: политика документа действует на всё,
    # что он грузит. На уровень server их не поднять — nginx не наследует
    # add_header в location, где есть свой add_header.
    #
    # CSP снята с фактической сборки (vite build), без запаса:
    #   script-src 'self'  — один <script type="module" src="/assets/…">,
    #                        инлайн-скриптов и eval в бандле нет;
    #   style-src 'self'   — один /assets/*.css; style={{…}} в React пишется
    #                        через CSSOM, CSP его не касается;
    #   img-src 'self'     — картинки только из загрузок, /uploads/images/… на
    #                        том же origin. Внешний URL (товару его можно вписать
    #                        руками, баннеру — задать через API) в админке не
    #                        покажется; в данные и на весы уйдёт как есть;
    #   font-src 'none'    — шрифтов нет, только системные;
    #   connect-src 'self' — fetch только на /api: VITE_API_BASE_URL пустой и в
    #                        проде, и на staging.
    # Начнёт сборка грузить что-то ещё — браузер напишет нарушение в консоль.
    #
    # Permissions-Policy: ни одно из этих API SPA не трогает, поэтому все
    # выключены — запросить камеру или геолокацию не сможет и внедрённый код.
    # bluetooth и web-share не перечислены: Chromium под Linux их не знает и
    # пишет «Unrecognized feature» в консоль на каждой загрузке.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'none'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), local-fonts=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), screen-wake-lock=(), serial=(), usb=(), window-management=(), xr-spatial-tracking=()" always;
    }

    # SPA-фолбэк. ОБЯЗАТЕЛЕН: маршрутизация в приложении рукописная
    # (history.pushState/popstate в src/main.tsx), маршруты /accept-invite,
    # /forgot-password, /password-reset, /reset-password. Без фолбэка прямой
    # заход по такой ссылке — а именно так приходят письма про сброс пароля —
    # даёт 404.
    location / {
        try_files $uri /index.html;
    }
}
